name: Pages (web app + llm-wiki + docs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage Pages site
        run: |
          mkdir -p site
          # The web app UI at the site root (relative assets, same files the
          # local server serves). Without a backend it runs in guide mode and
          # walks the user through the latest release; with OBD_ALLOWED_ORIGIN
          # set on the local engine, this hosted UI drives that engine fully.
          cp -r webapp/public/. site/
          # Knowledge base + docs beside the app
          cp -r llm-wiki site/llm-wiki
          cp -r docs site/docs
          cp README.md AGENTS.md site/ 2>/dev/null || true
          # Bake the repo URL so guide-mode download links are always right
          cat > site/config.js <<EOF
          window.OBD_REPO_URL = "https://github.com/${{ github.repository }}";
          EOF
          # One-command setup script, with the Pages origin + repo baked in
          sed -e "s|__PAGES_ORIGIN__|https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}|" \
              -e "s|__REPO_URL__|${{ github.server_url }}/${{ github.repository }}|" \
              scripts/bootstrap-remote.sh > site/bootstrap.sh
          chmod +x site/bootstrap.sh
          # Jekyll renders the markdown knowledge base; the app files pass through verbatim
          cat > site/_config.yml <<'EOF'
          title: Ollama Backup Deluxe
          theme: jekyll-theme-cayman
          markdown: kramdown
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
